<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选股王 / 高端版 · 广告×成交分析面板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#222; background:#f5f6f8; }
  header { background:#fff; padding:12px 18px; border-bottom:1px solid #e6e8ec; position:sticky; top:0; z-index:20; }
  h1 { font-size:17px; margin:0 0 4px; }
  #meta { font-size:11px; color:#888; margin-bottom:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; font-size:13px; }
  .controls label { color:#555; }
  select, input[type=date] { font-size:13px; padding:3px 6px; border:1px solid #cfd4dc; border-radius:5px; background:#fff; }
  nav.tabs { display:flex; gap:4px; background:#fff; padding:0 12px; border-bottom:1px solid #e6e8ec; position:sticky; top:96px; z-index:19; overflow-x:auto; }
  nav.tabs button { border:0; background:none; padding:10px 14px; font-size:14px; color:#666; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav.tabs button.on { color:#E60025; border-bottom-color:#E60025; font-weight:600; }
  main { padding:16px; max-width:1400px; margin:0 auto; }
  section { display:none; }
  section.on { display:block; }
  .card { background:#fff; border:1px solid #e6e8ec; border-radius:8px; padding:14px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:#333; font-weight:600; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:900px){ .grid2{ grid-template-columns:1fr; } }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td { border:1px solid #eceef2; padding:5px 8px; text-align:center; }
  th { background:#fafbfc; color:#555; font-weight:600; }
  td.l, th.l { text-align:left; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:800px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi { background:#fff; border:1px solid #e6e8ec; border-radius:8px; padding:12px; }
  .kpi .t { font-size:12px; color:#888; }
  .kpi .v { font-size:26px; font-weight:700; margin:4px 0; }
  .kpi .d { font-size:12px; }
  .warn { background:#fdeef0; border:1px solid #f3c2ca; color:#a01526; padding:8px 12px; border-radius:6px; margin-top:8px; font-size:13px; }
  .ok { background:#f1f8f2; border:1px solid #bfe0c5; color:#187a2e; padding:8px 12px; border-radius:6px; margin-top:8px; font-size:13px; }
  .mcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .mc { border:1px solid #eceef2; border-radius:8px; overflow:hidden; background:#fff; }
  .mc img { width:100%; height:110px; object-fit:contain; background:#f7f8fa; display:block; }
  .mc .bd { padding:7px 9px; font-size:12px; }
  .mc .ti { color:#444; height:30px; overflow:hidden; margin-bottom:4px; }
  .mc .row { display:flex; justify-content:space-between; color:#666; }
  .mc .hi { color:#E60025; font-weight:700; }
  .bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:#E60025; }
  .sub { font-size:12px; color:#777; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1>选股王 / 高端版 · 广告 × 成交 分析面板</h1>
  <div id="meta">加载中…</div>
  <div class="controls">
    <label>粒度
      <select id="gran">
        <option value="day">日</option>
        <option value="week" selected>周（固定 周一~周日）</option>
        <option value="rweek">周（滚动 最近7天）</option>
        <option value="month">月</option>
        <option value="quarter">季</option>
      </select>
    </label>
    <label>基准日 <input type="date" id="refDate"></label>
    <label>分组
      <select id="grp"><option>全部</option><option>选股王</option><option>新开升级</option></select>
    </label>
    <span id="periodLabel" style="color:#888"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-t="amount" class="on">单量</button>
  <button data-t="ad">广告</button>
  <button data-t="link">跳转链接</button>
  <button data-t="material">素材</button>
  <button data-t="event">活动/规律</button>
</nav>

<main>
  <section id="tab-amount" class="on">
    <div class="card"><h2>核心 KPI（本期 / 环比 / 同比）</h2><div class="kpis" id="kpis"></div></div>
    <div class="grid2">
      <div class="card"><h2>新开升级 · 单量趋势（按当前粒度）</h2><div id="amtTrendXk" style="height:280px"></div></div>
      <div class="card"><h2>选股王 · 单量趋势（按当前粒度）</h2><div id="amtTrendXg" style="height:280px"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>环比：本期 vs 环比期</h2><div id="amtMom" style="height:280px"></div></div>
      <div class="card"><h2>同比：本期 vs 同比期</h2><div id="amtYoy" style="height:280px"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>端分布（本期）</h2><div id="devChart" style="height:280px"></div></div>
      <div class="card"><h2>目标达成</h2><div id="targets"></div></div>
    </div>
  </section>

  <section id="tab-ad">
    <div class="card"><h2>分组 × 渠道 环比总表（变化数值，红涨绿跌）</h2><div class="sub" id="adSub"></div><div id="adTable"></div></div>
    <div id="adChannels"></div>
  </section>

  <section id="tab-link">
    <div class="card"><h2>跳转链接（落地页）效果 · 按点击购买率排序</h2><div class="sub" id="linkSub"></div><div id="linkChart" style="height:340px"></div></div>
    <div class="card"><h2>链接明细与问题识别</h2><div id="linkTable"></div></div>
  </section>

  <section id="tab-material">
    <div class="card"><h2>各渠道素材 TOP5 / BOTTOM5（阶段内 · 仅工作日 · 按点击率）</h2>
      <div class="sub" id="matSub"></div>
      <div id="matTop"></div>
      <div style="height:14px"></div>
      <div id="matBottom"></div>
    </div>
  </section>

  <section id="tab-event">
    <div class="card"><h2>彩蛋活动专项</h2><div id="caidanTable"></div></div>
    <div class="card"><h2>彩蛋分布</h2><div id="caidanChart" style="height:280px"></div></div>
    <div class="card"><h2>周末 / 工作日规律 · 异常预警</h2><div id="pattern"></div></div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
